<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Server error · Scam Website Checker</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      background: #fafafa;
      color: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0a0a0a; color: #fafafa; }
    }
    .card {
      max-width: 560px;
      width: 100%;
      text-align: center;
      padding: 48px 32px;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.06);
    }
    @media (prefers-color-scheme: dark) {
      .card { background: #111; border-color: #262626; }
    }
    .code {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #dc2626;
      margin: 0 0 12px;
    }
    h1 {
      font-size: 32px;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin: 0 0 12px;
      font-weight: 600;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #525252;
      margin: 0 0 28px;
    }
    @media (prefers-color-scheme: dark) {
      p { color: #a3a3a3; }
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #0a0a0a; color: #fff; }
    .btn-secondary { background: transparent; color: inherit; border: 1px solid #e5e5e5; }
    @media (prefers-color-scheme: dark) {
      .btn-primary { background: #fafafa; color: #0a0a0a; }
      .btn-secondary { border-color: #262626; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <p class="code">Error 500</p>
    <h1>Something went wrong</h1>
    <p>The server hit an unexpected error. The issue has been logged. Please try again in a few minutes.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">← Back to home</a>
      <a class="btn btn-secondary" href="/contact">Report this issue</a>
    </div>
  </main>
</body>
</html>
